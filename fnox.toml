# age provider はグローバル設定のもの（復号に使う identity を含む）を使う。同名の provider を
# ここで定義すると丸ごと置き換わって identity が消えるため、providers は書かない

# グローバルには provider が2つあり、指定を省いた fnox set が値を平文で保存するため
default_provider = "age"

[profiles.bot.secrets]
# headersHelper は fnox get で取るので、fnox exec -P bot の子プロセスには渡さない
K8O_API_MCP_TOKEN= { provider = "age", value = "", env = false }
