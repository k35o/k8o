name: Knip Report

on:
  schedule:
    # 毎週月曜 9:41 JST。毎時 0 分は GitHub に遅らされるので外す
    - cron: '41 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: $/.github/actions/setup
      - name: Run knip report
        uses: k35o/patrol-board@v0.0.3
        with:
          script: './.github/scripts/knip-report.sh'
          issue-title: 'Knip 定期レポート'
          issue-label: 'knip-report'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
