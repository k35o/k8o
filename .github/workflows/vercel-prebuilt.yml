name: Vercel Prebuilt Deploy

# Vercel の Build Minutes を消費しないよう、ビルドを GitHub Actions（public repo は無料）で行い、
# `vercel build` の成果物を `vercel deploy --prebuilt` でアップロードだけする。
# Git 連携の自動ビルドと並存できるよう preview デプロイに限定している。
# 本採用時は push / pull_request トリガーへ広げ、各 app の vercel.json に
# `"git": { "deploymentEnabled": false }` を追加して二重デプロイを防ぐ。
on:
  # workflow_dispatch は default ブランチに載るまで起動できないため、
  # この workflow 自身を変更する PR では全 app を試行デプロイして検証する
  pull_request:
    paths:
      - '.github/workflows/vercel-prebuilt.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'デプロイするアプリ'
        required: true
        type: choice
        options:
          - main
          - admin
          - ai
        default: main

permissions: {}

jobs:
  deploy-preview:
    # fork PR は VERCEL_TOKEN を取得できないため除外する
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.app)) || fromJSON('["main", "admin", "ai"]') }}
    concurrency:
      group: vercel-prebuilt-${{ github.ref }}-${{ matrix.app }}
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # プロジェクト ID は秘密情報ではないため、app との対応を workflow に直書きして自己文書化する
      VERCEL_PROJECT_ID: ${{ fromJSON('{"main":"prj_OrrQ8Nnl4sJJii9kpjOAtb6EeIjD","admin":"prj_aehv1FNgGlp0nGIZPyPFHShRqlAW","ai":"prj_Iz1SHi1C6rgwFz2YngTzeiRdsFE8"}')[matrix.app] }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Pull Vercel project settings
        run: pnpm dlx vercel@54.3.0 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        env:
          # sensitive 設定の env var は `vercel pull` だと空になるため、ビルド時に必要な
          # GITHUB_TOKEN は Actions のトークンで代替する（トップページの contributions 取得で使う）
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm dlx vercel@54.3.0 build --token="$VERCEL_TOKEN"

      - name: Deploy (preview)
        run: |
          URL=$(pnpm dlx vercel@54.3.0 deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "Preview (${{ matrix.app }}): $URL" >> "$GITHUB_STEP_SUMMARY"
