name: Vercel Prebuilt Deploy

# ビルドを GitHub Actions（public repo は無料）で行い、`vercel build` の成果物を
# `vercel deploy --prebuilt` でアップロードだけすることで、Vercel の Build Minutes を
# 消費せずにデプロイする。Vercel 側の Git 連携ビルドは各 app の vercel.json の
# `"git": { "deploymentEnabled": false }` で停止しており、preview（PR）と
# production（main への push）の両方をこの workflow が担う。
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      app:
        description: 'preview をデプロイするアプリ'
        required: true
        type: choice
        options:
          - main
          - api
          - ai
          - main-k8ordo
        default: main

permissions: {}

jobs:
  detect:
    # fork PR は VERCEL_TOKEN を取得できず、renovate ブランチは preview 不要のため除外する
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.fork != true && !startsWith(github.head_ref, 'renovate/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # merge-base の解決に履歴が必要（shallow だと base の古い PR で誤検出する）
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Detect affected apps
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_APP: ${{ inputs.app }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "apps=[\"$DISPATCH_APP\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 並走中の main-k8ordo は main のプロジェクトの preview にだけ出す。push では拾わない
          if [ "$EVENT_NAME" = "push" ]; then
            ALL_APPS='["main","api","ai"]'
          else
            ALL_APPS='["main","api","ai","main-k8ordo"]'
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            BASE="$PUSH_BEFORE"
            # force push 等で before が辿れないと判定不能なので、安全側で全 app をデプロイする
            if ! git rev-parse --verify "$BASE^{commit}" > /dev/null 2>&1; then
              echo "apps=$ALL_APPS" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            BASE=$(git merge-base origin/main HEAD)
          fi

          CHANGED=$(git diff --name-only "$BASE" HEAD)

          # ビルド判定の基盤やルート依存が変わったら全 app を安全側でデプロイする
          if echo "$CHANGED" | grep -qE '^(turbo\.json|mise\.toml|package\.json|pnpm-workspace\.yaml|pnpm-lock\.yaml|\.github/workflows/vercel-prebuilt\.yml|\.github/vercel-cli/.+)$'; then
            echo "apps=$ALL_APPS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 判定不能時は安全側で全 app をデプロイする
          if ! AFFECTED=$(pnpm turbo query affected --packages --base "$BASE"); then
            echo "apps=$ALL_APPS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          apps=()
          echo "$AFFECTED" | grep -q '"name": "main"' && apps+=(main)
          echo "$AFFECTED" | grep -q '"name": "@repo/api"' && apps+=(api)
          echo "$AFFECTED" | grep -q '"name": "@repo/ai"' && apps+=(ai)
          [ "$EVENT_NAME" != "push" ] && echo "$AFFECTED" | grep -q '"name": "main-k8ordo"' && apps+=(main-k8ordo)
          # vercel.json は turbo のパッケージ入力に含まれないため個別に拾う
          echo "$CHANGED" | grep -q '^apps/main/vercel\.json$' && apps+=(main)
          echo "$CHANGED" | grep -q '^apps/api/vercel\.json$' && apps+=(api)
          echo "$CHANGED" | grep -q '^apps/ai/vercel\.json$' && apps+=(ai)
          [ "$EVENT_NAME" != "push" ] && echo "$CHANGED" | grep -q '^apps/main-k8ordo/vercel\.json$' && apps+=(main-k8ordo)

          if [ "${#apps[@]}" -eq 0 ]; then
            echo 'apps=[]' >> "$GITHUB_OUTPUT"
          else
            echo "apps=$(printf '%s\n' "${apps[@]}" | sort -u | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi

      - name: Show detected apps
        env:
          APPS: ${{ steps.detect.outputs.apps }}
        run: echo "apps=$APPS"

  # 本番 DB のマイグレーションは、どのアプリのビルドよりも先に一度だけ流す。アプリは並列に
  # デプロイされるので、ビルドの中で流すと新しいスキーマより先に別のアプリが出ることがある。
  # main のビルドは DB を読むので、その前に終わっている必要もある。preview は deploy の中で流す
  migrate:
    needs: detect
    if: ${{ github.event_name == 'push' && needs.detect.result == 'success' && needs.detect.outputs.apps != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    # concurrency は付けない。同じグループで待っている run は新しい run に置き換えられ、その run の
    # デプロイが全 app 分飛ばされる。重なっても、未適用のマイグレーションは1つのトランザクションで
    # 流れるので、後から流した方が DB を壊さずに失敗する（再実行すればよい）
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Migrate k8o DB
        env:
          K8O_TURSO_DATABASE_URL: ${{ secrets.K8O_TURSO_DATABASE_URL }}
          K8O_TURSO_AUTH_TOKEN: ${{ secrets.K8O_TURSO_AUTH_TOKEN }}
        run: pnpm -F @repo/database migrate

      - name: Migrate ai DB
        env:
          AI_TURSO_DATABASE_URL: ${{ secrets.AI_TURSO_DATABASE_URL }}
          AI_TURSO_AUTH_TOKEN: ${{ secrets.AI_TURSO_AUTH_TOKEN }}
        run: pnpm -F @repo/ai-database migrate

  deploy:
    needs: [detect, migrate]
    # preview では migrate がスキップされる。状態を見る関数が無いと暗黙の success() が付き、
    # needs のスキップで deploy もスキップされるので、!cancelled() で外して result を明示確認する。
    # 本番は migrate の成功を待つ。skip された detect（fork PR・renovate）では起動しない
    if: ${{ !cancelled() && needs.detect.result == 'success' && needs.detect.outputs.apps != '[]' && (needs.migrate.result == 'success' || (github.event_name != 'push' && needs.migrate.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PR は workflow 自体を書き換えて任意の repo secret を参照できるため、本番の資格情報は
    # main に限定した production Environment にだけ置き、preview から届かないことを GitHub 側で担保する
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    concurrency:
      group: vercel-prebuilt-${{ github.ref }}-${{ matrix.app }}
      cancel-in-progress: true
    # VERCEL_TOKEN はチーム全体に効く無期限のトークンなので、依存やアプリのコードを動かす Setup・Build に
    # 見せないよう、job の env に置かず pull と deploy のステップにだけ渡す（vercel build はトークンを使わない）
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      # プロジェクト ID は秘密情報ではないため、app との対応を workflow に直書きして自己文書化する。
      # main-k8ordo は、切り替えのあとと同じ設定で確かめるため、main のプロジェクトの preview に出す
      VERCEL_PROJECT_ID: ${{ fromJSON('{"main":"prj_OrrQ8Nnl4sJJii9kpjOAtb6EeIjD","api":"prj_aehv1FNgGlp0nGIZPyPFHShRqlAW","ai":"prj_Iz1SHi1C6rgwFz2YngTzeiRdsFE8","main-k8ordo":"prj_OrrQ8Nnl4sJJii9kpjOAtb6EeIjD"}')[matrix.app] }}
      DEPLOY_TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      # main-k8ordo は main のプロジェクトに出すので、production に出すと k8o.me が作りかけの版に替わる。
      # detect が push で拾わないのに加え、ここでも止める
      - name: Refuse to deploy main-k8ordo to production
        if: ${{ matrix.app == 'main-k8ordo' && env.DEPLOY_TARGET == 'production' }}
        run: |
          echo "::error::main-k8ordo は preview にだけ出す"
          exit 1

      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Vercel CLI
        working-directory: .github/vercel-cli
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel project settings
        working-directory: .github/vercel-cli
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel pull --cwd "$GITHUB_WORKSPACE" --yes --environment="$DEPLOY_TARGET"

      # main のプロジェクトの Root Directory は apps/main なので、pull した設定だけを main-k8ordo に向ける
      - name: Point the project settings at apps/main-k8ordo
        if: ${{ matrix.app == 'main-k8ordo' }}
        run: |
          project="$GITHUB_WORKSPACE/.vercel/project.json"
          jq '.settings.rootDirectory = "apps/main-k8ordo"' "$project" > "$project.tmp"
          mv "$project.tmp" "$project"

      # preview は承認が要る Environment なので、承認を1回で済ませるよう migrate を別ジョブにせず
      # deploy の中で流す（k8o の DB は main、ai の DB は ai）。preview では、ほかのアプリが先に出ることがある。
      # 同じ DB に2つの job が並んで流すと後のものが失敗するので、main-k8ordo は main が出ないときだけ流す
      - name: Migrate preview k8o DB
        if: ${{ env.DEPLOY_TARGET == 'preview' && (matrix.app == 'main' || (matrix.app == 'main-k8ordo' && !contains(fromJSON(needs.detect.outputs.apps), 'main'))) }}
        run: |
          set -a
          # shellcheck disable=SC1090
          . <(grep -E '^K8O_TURSO_(DATABASE_URL|AUTH_TOKEN)=' "$GITHUB_WORKSPACE/.vercel/.env.preview.local")
          set +a
          # pull した値は secrets ではないので、ログに出ないよう自分で伏せる
          echo "::add-mask::$K8O_TURSO_DATABASE_URL"
          echo "::add-mask::$K8O_TURSO_AUTH_TOKEN"
          pnpm -F @repo/database migrate

      - name: Migrate preview ai DB
        if: ${{ env.DEPLOY_TARGET == 'preview' && matrix.app == 'ai' }}
        run: |
          set -a
          # shellcheck disable=SC1090
          . <(grep -E '^AI_TURSO_(DATABASE_URL|AUTH_TOKEN)=' "$GITHUB_WORKSPACE/.vercel/.env.preview.local")
          set +a
          echo "::add-mask::$AI_TURSO_DATABASE_URL"
          echo "::add-mask::$AI_TURSO_AUTH_TOKEN"
          pnpm -F @repo/ai-database migrate

      - name: Build preview
        if: ${{ env.DEPLOY_TARGET == 'preview' }}
        working-directory: .github/vercel-cli
        run: pnpm exec vercel build --cwd "$GITHUB_WORKSPACE"

      # production の Turso のトークンも sensitive で pull できないため、接続情報は production Environment の
      # secrets から注入する（ambient な環境変数は pull された .env より優先される）。ビルドは依存の
      # コードも動かすので、アプリがビルドで読む DB の分だけを渡す。main は k8o の DB を読み取り専用の
      # トークンで読み、ai は ai の DB を読み、api はビルドで DB を読まない
      - name: Build production
        if: ${{ env.DEPLOY_TARGET == 'production' }}
        working-directory: .github/vercel-cli
        env:
          K8O_TURSO_DATABASE_URL: ${{ matrix.app == 'main' && secrets.K8O_TURSO_DATABASE_URL || '' }}
          K8O_TURSO_AUTH_TOKEN: ${{ matrix.app == 'main' && secrets.K8O_TURSO_READONLY_AUTH_TOKEN || '' }}
          AI_TURSO_DATABASE_URL: ${{ matrix.app == 'ai' && secrets.AI_TURSO_DATABASE_URL || '' }}
          AI_TURSO_AUTH_TOKEN: ${{ matrix.app == 'ai' && secrets.AI_TURSO_AUTH_TOKEN || '' }}
        run: pnpm exec vercel build --cwd "$GITHUB_WORKSPACE" --prod

      - name: Deploy
        id: deploy
        working-directory: .github/vercel-cli
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          APP: ${{ matrix.app }}
        # Hobby には 24 時間 5,000 ファイルのアップロード上限（api-upload-free）があり、
        # main の成果物は数千ファイルあるため、tarball 1 本にまとめてアップロードする
        run: |
          if [ "$DEPLOY_TARGET" = "production" ]; then
            URL=$(pnpm exec vercel deploy --cwd "$GITHUB_WORKSPACE" --prebuilt --prod --archive=tgz)
          else
            URL=$(pnpm exec vercel deploy --cwd "$GITHUB_WORKSPACE" --prebuilt --archive=tgz)
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "$APP ($DEPLOY_TARGET): $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate k8o-bot token
        if: ${{ github.event_name == 'pull_request' }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.K35O_BOT_CLIENT_ID }}
          private-key: ${{ secrets.K35O_BOT_PRIVATE_KEY }}
          permission-pull-requests: write

      # Git 連携停止で Vercel bot の preview URL コメントが来なくなる代わりに、
      # app ごとに 1 コメントを marker で更新し続ける
      - name: Comment preview URL
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APP: ${{ matrix.app }}
        run: |
          marker="<!-- vercel-prebuilt:$APP -->"
          body=$(printf '%s\nPreview (**%s**): %s (%s)' "$marker" "$APP" "$URL" "$HEAD_SHA")
          cid=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$cid" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi
