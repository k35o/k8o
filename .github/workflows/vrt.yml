name: vrt

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: vrt-${{ github.ref }}
  cancel-in-progress: true

# VRT対象アプリ（pnpm workspaceのfilter名）。アプリを追加したらここに足す
env:
  VRT_APPS: main ai main-k8ordo

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  vrt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # --with-deps の apt は mirror が遅いと数分かかるので、OS の
    # ライブラリまで入ったイメージで走らせる。
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-resolute
      options: --user 1001 --ipc=host
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Capture story screenshots
        run: |
          for app in $VRT_APPS; do
            pnpm -F "$app" run test:vrt
          done

      # main: 撮影結果を次回のPR比較用ベースラインとして保存する
      # （.vrt は隠しディレクトリで artifact の glob から漏れるため、非隠しディレクトリへ集める）
      - name: Collect baselines
        if: github.event_name == 'push'
        run: |
          for app in $VRT_APPS; do
            mkdir -p "vrt-baseline/$app"
            cp -r "apps/$app/.vrt/actual" "vrt-baseline/$app/actual"
          done

      - name: Upload baseline
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-baseline
          path: vrt-baseline
          retention-days: 30

      # PR: mainの最新ベースラインを取得する（無いアプリは比較をスキップ）
      - name: Find baselines from main
        if: github.event_name == 'pull_request'
        id: baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'vrt.yml',
              branch: 'main',
              event: 'push',
              status: 'success',
              per_page: 1,
            });
            const run = data.workflow_runs[0];
            // branch=main だけだと、fork の main ブランチから出た PR の run も当たる。この repo への push の run に限る
            if (run === undefined || run.head_repository.full_name !== `${owner}/${repo}`) return;
            const {
              data: { artifacts },
            } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: run.id,
              name: 'vrt-baseline',
            });
            if (artifacts.some((artifact) => !artifact.expired)) {
              core.setOutput('found', 'true');
              core.setOutput('run-id', String(run.id));
            }

      - name: Download baselines from main
        if: steps.baseline.outputs.found == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vrt-baseline
          path: vrt-baseline
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Place baselines
        if: github.event_name == 'pull_request'
        run: |
          for app in $VRT_APPS; do
            if [ -d "vrt-baseline/$app/actual" ]; then
              mkdir -p "apps/$app/.vrt"
              cp -r "vrt-baseline/$app/actual" "apps/$app/.vrt/expected"
            else
              echo "baseline not found: $app"
            fi
          done

      # 並走の main-k8ordo は、main に対応する story を main のベースラインと比べて Next との差を見る。
      # main に無い story と、main と違うことを許した story（OWN_BASELINE_KEYS）は、上で置いた
      # main-k8ordo の前回のベースラインと比べる。スクリーンショットは story のファイルのパスで
      # 置かれるので、app/_components と app/<area>/_components を components/site と
      # components/<area> に置き直し、main-k8ordo に写した story の分だけを上書きする
      - name: Map main baselines onto main-k8ordo
        if: github.event_name == 'pull_request'
        env:
          OWN_BASELINE_KEYS: |
            src/components/site/toggle-theme/toggle-theme.stories.tsx/Click-Toggle.png
        run: |
          src=vrt-baseline/main/actual
          dest=apps/main-k8ordo/.vrt/expected
          if [ ! -d "$src" ]; then
            echo "main baseline not found: main-k8ordo"
            exit 0
          fi
          find "$src/src/app" -name '*.png' | while read -r file; do
            key="${file#"$src"/}"
            case "$key" in
              src/app/_components/*) mapped="src/components/site/${key#src/app/_components/}" ;;
              src/app/*/_components/*)
                area="${key#src/app/}"
                area="${area%%/*}"
                mapped="src/components/$area/${key#src/app/"$area"/_components/}"
                ;;
              *) continue ;;
            esac
            if printf '%s\n' "$OWN_BASELINE_KEYS" | grep -Fqx "$mapped"; then
              continue
            fi
            if [ -f "apps/main-k8ordo/$(dirname "$mapped")" ]; then
              mkdir -p "$dest/$(dirname "$mapped")"
              cp "$file" "$dest/$mapped"
            fi
          done

      - name: Compare against baselines
        if: github.event_name == 'pull_request'
        id: compare
        run: |
          failed=false
          for app in $VRT_APPS; do
            if [ ! -d "apps/$app/.vrt/expected" ]; then
              echo "skip compare: $app (baseline not found)"
              continue
            fi
            pnpm -F "$app" exec svrt compare || failed=true
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Collect reports
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p vrt-site
          for app in $VRT_APPS; do
            cp -r "apps/$app/.vrt" "vrt-site/$app"
          done

      - name: Upload report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-report
          path: vrt-site
          retention-days: 14

      # fork PR は secrets（Cloudflareトークン）を取得できないため除外する
      - name: Publish report to Cloudflare Pages
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 31074c2d041f3ceb8a5bb3fc51dd3bfa
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # トークン未登録の間はスキップし、artifactのみのフォールバックになる
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'CLOUDFLARE_API_TOKEN が未登録のためPagesへの公開をスキップ'
            exit 0
          fi
          pnpm exec wrangler pages project create k8o-vrt --production-branch=main 2>/dev/null || true
          pnpm exec wrangler pages deploy vrt-site --project-name=k8o-vrt --branch="pr-$PR_NUMBER" --commit-dirty=true
          echo "base=https://pr-$PR_NUMBER.k8o-vrt.pages.dev" >> "$GITHUB_OUTPUT"

      # fork PR は GITHUB_TOKEN が read-only でコメント投稿に失敗するため除外する
      # sticky コメントの upsert は svrt comment 本体がやる（--id でアプリごとに独立した
      # コメントを維持。差分ゼロかつ既存コメント無しのアプリは投稿しない）
      - name: Comment summary on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_BASE: ${{ steps.pages.outputs.base }}
        shell: bash
        run: |
          for app in $VRT_APPS; do
            if [ ! -f "apps/$app/.vrt/report.json" ]; then
              echo "skip comment: $app (report not found)"
              continue
            fi
            args=(--id "$app")
            if [ -n "$PAGES_BASE" ]; then
              args+=(--report-url "$PAGES_BASE/$app")
            fi
            pnpm -F "$app" exec svrt comment "${args[@]}"
          done

      # 差分があっても CI は落とさず、warning 注釈で可視化するだけにする。
      # 意図した変更かの判断は人間が PR コメント（sticky）と report を見て行う。
      - name: Warn when differences exist
        if: github.event_name == 'pull_request' && steps.compare.outputs.failed == 'true'
        run: |
          echo '::warning::視覚的な差分があります。PRコメントとvrt-report artifactを確認してください。'
