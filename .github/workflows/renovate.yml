name: Renovate

on:
  # 毎時 0 分は GitHub に遅らされたり飛ばされたりするので外す
  schedule:
    - cron: '23 */3 * * *'
  # マージで main が進んだら、衝突した PR をすぐ作り直す（rebaseWhen: conflicted）
  push:
    branches: [main]
  issues:
    types: [edited]
  pull_request_target:
    types: [edited, closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    # 重ねて走らせない。workflow に付けると、if で飛ばす起動が待っている実行を押しのける
    concurrency:
      group: renovate
      cancel-in-progress: false
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.title, 'Dependency Dashboard') && github.event.sender.login == github.repository_owner) ||
      (github.event_name == 'pull_request_target' && github.event.sender.login == github.repository_owner && contains(github.event.pull_request.labels.*.name, 'renovate'))
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.K35O_BOT_CLIENT_ID }}
          private-key: ${{ secrets.K35O_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.9
        with:
          token: ${{ steps.generate-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
