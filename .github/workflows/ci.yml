name: ci

on: push

# 同一ブランチへの連続pushでは古い実行をキャンセルする（mainは全コミットの結果を残す）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Run ls-lint
        run: pnpm run ls-lint

      # oxlint の type-aware ルールは、route の型（ai の Next・main の k8ordo）と CSS Modules の型を読む。
      # 無いと Route を string、styles のクラスを string | undefined とみなして誤検出するので、check の前に書く
      - name: Generate route and CSS Modules types
        run: pnpm run typegen

      - name: Run check
        run: pnpm run check

      - name: Run type check
        run: pnpm run type-check

      # デプロイではマイグレーションを作らず、コミットされたものだけを流す
      - name: Check database migrations are committed
        run: |
          pnpm -F @repo/database generate
          pnpm -F @repo/ai-database generate
          changes=$(git status --porcelain -- packages/database/migrations packages/ai-database/migrations)
          if [ -n "$changes" ]; then
            echo "::error::スキーマの変更に対応するマイグレーションがコミットされていない。各 DB パッケージで generate した結果をコミットする"
            echo "$changes"
            exit 1
          fi

      - name: Check ER diagram is up to date
        run: |
          pnpm -F @repo/database build:erd
          if ! git diff --quiet -- packages/database/README.md; then
            echo "::error::README の ER 図がスキーマと一致していない。pnpm -F @repo/database build:erd の結果をコミットする"
            git --no-pager diff -- packages/database/README.md
            exit 1
          fi

      - name: Check migration journal timestamps are increasing
        run: |
          failed=0
          for journal in packages/database/migrations/meta/_journal.json packages/ai-database/migrations/meta/_journal.json; do
            errors=$(jq -r --arg f "$journal" '.entries | sort_by(.idx) | . as $e | range(1; length) | $e[.] as $cur | select($cur.when <= $e[. - 1].when) | "::error file=\($f)::idx \($cur.idx)（\($cur.tag)）の when が直前のエントリより大きくなく、migrate がこのマイグレーションを飛ばす。番号を手で付け替えず generate で作り直す"' "$journal")
            if [ -n "$errors" ]; then
              echo "$errors"
              failed=1
            fi
          done
          exit "$failed"

  # storybook の project は Story を Chromium で描くので CPU を食い、ほかの試験と
  # 同じマシンに並べると、ほかの試験が時間切れになる。マシンを分ける
  test-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Run test
        run: pnpm run test -- --project='!storybook'

  test-storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # --with-deps の apt は mirror が遅いと数分かかるので、OS の
    # ライブラリまで入ったイメージで走らせる。
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-resolute
      options: --user 1001 --ipc=host
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-${{ github.job }}-

      # storybook の project を持つアプリ。持たない package に --project=storybook を渡すと
      # vitest が落ちるので名指しする。アプリを足したらここにも足す
      - name: Run test
        run: pnpm run test --filter=./apps/main --filter=./apps/ai -- --project=storybook

  # main のルールセットが必須にしているのはこの名前なので、分けたジョブの結果をまとめる。
  # always() でないと、分けたジョブが落ちたときに skip され、必須のチェックを通ってしまう
  test:
    needs: [test-node, test-storybook]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check results
        run: test "$NODE" = success && test "$STORYBOOK" = success
        env:
          NODE: ${{ needs.test-node.result }}
          STORYBOOK: ${{ needs.test-storybook.result }}
