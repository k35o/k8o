name: ci

on: push

# 同一ブランチへの連続pushでは古い実行をキャンセルする（mainは全コミットの結果を残す）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Run ls-lint
        run: pnpm run ls-lint

      # oxlint の type-aware ルール(typescript/no-unnecessary-type-assertion 等)は
      # Next.js が生成する Route 型に依存する。check は type-check より先に走るため、
      # 先に各アプリの型を生成しておかないと Route を string とみなし `as Route` を
      # 不要と誤検出する。
      - name: Generate Next.js route types
        # api は Next.js ではないため除く
        run: pnpm --filter "./apps/*" --filter "!@repo/api" exec next typegen

      - name: Run check
        run: pnpm run check

      - name: Run type check
        run: pnpm run type-check

      # ai は auth-shell を source のまま読むので、auth-shell の CSS Modules の型はコミットしたものを使う
      - name: Check CSS Modules types of auth-shell are committed
        run: |
          pnpm -F @repo/auth-shell exec better-css-modules generate
          changes=$(git status --porcelain -- packages/auth-shell/src)
          if [ -n "$changes" ]; then
            echo "::error::auth-shell の CSS Modules の型が最新でない。packages/auth-shell で better-css-modules generate した結果をコミットする"
            echo "$changes"
            exit 1
          fi

      # デプロイではマイグレーションを作らず、コミットされたものだけを流す
      - name: Check database migrations are committed
        run: |
          pnpm -F @repo/database generate
          pnpm -F @repo/ai-database generate
          changes=$(git status --porcelain -- packages/database/migrations packages/ai-database/migrations)
          if [ -n "$changes" ]; then
            echo "::error::スキーマの変更に対応するマイグレーションがコミットされていない。各 DB パッケージで generate した結果をコミットする"
            echo "$changes"
            exit 1
          fi

      - name: Check migration journal timestamps are increasing
        run: |
          failed=0
          for journal in packages/database/migrations/meta/_journal.json packages/ai-database/migrations/meta/_journal.json; do
            errors=$(jq -r --arg f "$journal" '.entries | sort_by(.idx) | . as $e | range(1; length) | $e[.] as $cur | select($cur.when <= $e[. - 1].when) | "::error file=\($f)::idx \($cur.idx)（\($cur.tag)）の when が直前のエントリより大きくなく、migrate がこのマイグレーションを飛ばす。番号を手で付け替えず generate で作り直す"' "$journal")
            if [ -n "$errors" ]; then
              echo "$errors"
              failed=1
            fi
          done
          exit "$failed"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Install Playwright
        run: pnpm run install-playwright

      - name: Run test
        run: pnpm run test
