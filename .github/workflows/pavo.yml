name: Pavo

# 呼び出し先（review.yml）も contents: read で動く設計。リポジトリの
# デフォルト権限に依存せず、ここで GITHUB_TOKEN の上限を明示的に絞る
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

jobs:
  pavo:
    if: ${{ github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '/pavo') }}
    uses: k35o/pavo/.github/workflows/review.yml@a48fd5edee365ef2aeb5cd010fe946993a334d98 # main
    with:
      instructions: default,nextjs,typescript
      extra_prompt: |
        Next.js App Router（apps/main / apps/ai）と Hono（apps/api）+ oxlint のモノレポ。共有コードは packages/。
    secrets:
      K35O_BOT_CLIENT_ID: ${{ secrets.K35O_BOT_CLIENT_ID }}
      K35O_BOT_PRIVATE_KEY: ${{ secrets.K35O_BOT_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
