name: Pavo

# 呼び出し先（review.yml）も contents: read で動く設計。リポジトリの
# デフォルト権限に依存せず、ここで GITHUB_TOKEN の上限を明示的に絞る
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  # 持ち主のコメントだけで動く（jobs.pavo.if）
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]

jobs:
  pavo:
    # コメントで起こせるのは持ち主だけにする。呼び出し先はコメントした人を確かめる前に App のトークンを作り、
    # フォークかどうかも PR のイベントでしか見ない
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.comment.author_association == 'OWNER' &&
        (github.event_name == 'pull_request_review_comment' || startsWith(github.event.comment.body, '/pavo')))
    # main を digest で固定する。pavo の main が進んでから Renovate が digest を上げるまでは、コメントの main とずれる
    uses: k35o/pavo/.github/workflows/review.yml@1ac038aeca27bc50203a18f3c293429214104e1d # main zizmor: ignore[ref-version-mismatch]
    with:
      instructions: default,nextjs,typescript
      extra_prompt: |
        k8ordo の static（apps/main）、Next.js App Router（apps/ai）、Hono（apps/api）+ oxlint のモノレポ。共有コードは packages/。
    secrets:
      K35O_BOT_CLIENT_ID: ${{ secrets.K35O_BOT_CLIENT_ID }}
      K35O_BOT_PRIVATE_KEY: ${{ secrets.K35O_BOT_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
