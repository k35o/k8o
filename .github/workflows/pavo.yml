name: Pavo

# 呼び出し先（review.yml）も contents: read で動く設計。リポジトリの
# デフォルト権限に依存せず、ここで GITHUB_TOKEN の上限を明示的に絞る
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

jobs:
  pavo:
    if: ${{ github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '/pavo') }}
    uses: k35o/pavo/.github/workflows/review.yml@21b955bced9e341f6f41d06747040ea78f10c727 # main
    with:
      instructions: default,nextjs,typescript
      extra_prompt: |
        Next.js App Router + oxlint のモノレポ。apps/main / apps/admin + packages/。
    secrets: inherit
