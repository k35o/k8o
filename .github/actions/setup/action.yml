name: Setup
description: Setup mise and install dependencies

runs:
  using: 'composite'
  steps:
    - name: Setup mise
      uses: jdx/mise-action@v5.2.6 # zizmor: ignore[unpinned-uses] $/ で呼ぶワークフローの actions.lock がコミットを固定する
      with:
        cache: true

    - name: Install dependencies
      run: pnpm ci
      shell: bash
