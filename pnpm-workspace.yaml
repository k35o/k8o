packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: false
  msw: false
  sharp: false
  workerd: false

catalog:
  '@ai-sdk/openai-compatible': 3.0.30
  '@k8o/arte-odyssey': 12.0.1
  '@k8o/html-nest': 0.2.0
  '@k8o/oxc-config': 0.2.1
  '@next/env': 16.3.2
  '@next/mdx': 16.3.2
  '@next/third-parties': 16.3.2
  '@storybook/addon-a11y': 10.5.8
  '@storybook/addon-docs': 10.5.8
  '@storybook/addon-mcp': '0.7.0'
  '@storybook/addon-vitest': 10.5.8
  '@storybook/nextjs-vite': 10.5.8
  '@tailwindcss/postcss': 4.3.3
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  '@vitest/browser-playwright': 4.1.10
  '@vitest/coverage-v8': 4.1.10
  '@vitest/ui': 4.1.10
  ai: 7.0.66
  better-auth: 1.6.29
  chromatic: 18.2.0
  drizzle-orm: 0.45.2
  next: 16.3.2
  next-themes: 0.4.6
  postcss: 8.5.26
  postcss-load-config: 6.0.1
  react: 19.2.8
  react-dom: 19.2.8
  storybook: 10.5.8
  storybook-addon-determinism: 0.2.1
  storybook-addon-mock-date: 3.2.1
  storybook-addon-vrt: 0.4.0
  tailwindcss: 4.3.3
  vitest: 4.1.10
  wrangler: 4.123.0
  zod: 4.4.3

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - '@k8o/*'
  # 自作パッケージ（k35o公開）。@k8o/* と同じ信頼で除外する
  - storybook-addon-vrt
  - storybook-addon-mock-date
  - storybook-addon-determinism

trustPolicy: no-downgrade

# lockfile導入時点の到達版のうち、過去リリースよりtrust levelが低いもの。バージョン固定で除外し、更新時は再検査させる
trustPolicyExclude:
  - '@preact/signals@2.9.1'
  - 'ast-v8-to-istanbul@1.0.2'
  - 'semver@6.3.1'
  - 'tinyexec@1.2.2'

verifyDepsBeforeRun: install
