packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: false
  msw: false
  sharp: false
  workerd: false

catalog:
  '@ai-sdk/openai-compatible': 3.0.48
  '@k8o/html-nest': 0.2.0
  '@k8o/oxc-config': 0.3.0
  '@k8ordo/ui': 1.0.0
  '@next/env': 16.3.5
  '@next/mdx': 16.3.5
  '@next/third-parties': 16.3.5
  '@storybook/addon-a11y': 10.6.0
  '@storybook/addon-docs': 10.6.0
  '@storybook/addon-mcp': '10.6.0'
  '@storybook/addon-vitest': 10.6.0
  '@storybook/nextjs-vite': 10.6.0
  '@tailwindcss/postcss': 4.3.3
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitest/browser-playwright': 5.0.1
  '@vitest/coverage-v8': 5.0.1
  '@vitest/ui': 5.0.1
  ai: 7.0.99
  better-auth: 1.7.4
  chromatic: 18.8.1
  next: 16.3.5
  next-themes: 0.4.6
  postcss: 8.5.28
  postcss-load-config: 6.0.1
  react: 19.3.0
  react-dom: 19.3.0
  storybook: 10.6.0
  storybook-addon-determinism: 0.2.1
  storybook-addon-mock-date: 3.2.1
  storybook-addon-vrt: 0.4.0
  tailwindcss: 4.3.3
  vitest: 5.0.1
  wrangler: 4.131.1
  zod: 4.6.4

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - '@k8o/*'
  - '@k8ordo/*'
  # 自作パッケージ（k35o公開）。@k8o/* と同じ信頼で除外する
  - storybook-addon-vrt
  - storybook-addon-mock-date
  - storybook-addon-determinism

trustPolicy: no-downgrade

# lockfile導入時点の到達版のうち、過去リリースよりtrust levelが低いもの。バージョン固定で除外し、更新時は再検査させる
trustPolicyExclude:
  - '@preact/signals@2.9.1'
  - 'semver@6.3.1'
  - 'tinyexec@1.2.2'

verifyDepsBeforeRun: install
