packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: false
  sharp: false
  workerd: false

catalog:
  '@ai-sdk/anthropic': 4.0.72
  '@better-css-modules/cli': 0.4.1
  '@better-css-modules/core': 0.4.1
  '@better-css-modules/turbopack': 0.4.1
  '@better-css-modules/vite': 0.4.1
  '@k8o/html-nest': 0.2.0
  '@k8o/oxc-config': 1.1.0
  '@k8ordo/i18n': 1.0.0
  '@k8ordo/state': 1.0.0
  '@k8ordo/ui': 2.1.0
  '@libsql/client': 0.18.0
  '@next/env': 16.4.0
  '@next/mdx': 16.4.0
  '@next/third-parties': 16.4.0
  '@storybook/addon-a11y': 10.6.1
  '@storybook/addon-docs': 10.6.1
  '@storybook/addon-mcp': '10.6.1'
  '@storybook/addon-vitest': 10.6.1
  '@storybook/nextjs-vite': 10.6.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitest/browser-playwright': 5.0.3
  '@vitest/coverage-v8': 5.0.3
  '@vitest/ui': 5.0.3
  ai: 7.0.128
  better-auth: 1.7.7
  chromatic: 18.11.0
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.3
  hono: 4.13.13
  katex: 0.19.0
  next: 16.4.0
  next-themes: 0.4.6
  react: 19.3.0
  react-dom: 19.3.0
  storybook: 10.6.1
  storybook-addon-determinism: 0.2.1
  storybook-addon-mock-date: 3.2.1
  storybook-addon-vrt: 0.4.0
  vitest: 5.0.3
  wrangler: 4.149.0
  zod: 4.6.5

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - '@better-css-modules/*'
  - '@k8o/*'
  - '@k8ordo/*'
  # 自作パッケージ（k35o公開）。@k8o/* と同じ信頼で除外する
  - storybook-addon-vrt
  - storybook-addon-mock-date
  - storybook-addon-determinism
  # @better-css-modules/core 0.4.1 が固定する版（脆弱性の修正を含む）。2026-10-25 に成熟したら消す
  - 'postcss@8.5.31'

# drizzle-kit 0.31.11 は @esbuild-kit/esm-loader を依存に持つが、bundle のどこからも読み込まない。
# これが脆弱な esbuild 0.18 を固定して audit に残るので、依存ごと外す。drizzle-kit を上げたら要否を見直す
overrides:
  'drizzle-kit>@esbuild-kit/esm-loader': '-'
  # remark-math が使う micromark-extension-math は katex ^0.16 に依存する。index が HTML 出力用の
  # mathHtml も読み込むので katex を import するが、MDX の描画には使わない。記事が読む版と
  # そろえ、脆弱性のある 0.16 を残さない
  'micromark-extension-math>katex': 'catalog:'

patchedDependencies:
  '@storybook/nextjs-vite@10.6.1': patches/@storybook__nextjs-vite@10.6.1.patch

trustPolicy: no-downgrade

# lockfile導入時点の到達版のうち、過去リリースよりtrust levelが低いもの。バージョン固定で除外し、更新時は再検査させる
trustPolicyExclude:
  - '@preact/signals@2.9.1'
  - 'semver@6.3.1'
  - 'tinyexec@1.2.2'

verifyDepsBeforeRun: install
